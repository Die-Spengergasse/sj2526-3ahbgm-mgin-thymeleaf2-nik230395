<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
            text-align: left;
        }
         input[type="text"], input[type="date"] {
            width: 50%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
        }
         button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
        }
         button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Ausgewählten Patienten bearbeiten</h1>
    <form th:action=" @{/patients/edit/{id}(id=${patient.id})}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" th:value="${patient.name}" required>
        <br>
        <label for="birthday">Geburtstag:</label>
        <input type="date" id="birthday" name="birthday" th:value="${patient.birthday}" required>
        <br>
        <button type="submit">Änderungen speichern</button>
    </form>

</body>
</html>
